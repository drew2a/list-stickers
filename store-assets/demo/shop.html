<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mountain Leaf Tea: oolong and pu-erh</title>
<style>
  /* A made-up tea shop, used only to take the store screenshots: no real
     shop's name or design appears in them. */
  body { margin: 0; font: 15px/1.45 "Helvetica Neue", system-ui, sans-serif; color: #1e2a22; background: #eef2ec; }
  header { display: flex; align-items: center; gap: 26px; padding: 14px 40px; background: #1f3d2b; color: #fff; }
  .logo { font-weight: 700; font-size: 19px; letter-spacing: .01em; }
  .logo span { color: #f2c94c; }
  nav { display: flex; gap: 20px; font-size: 14px; color: #b9cbbd; }
  nav b { color: #fff; }
  .search { margin-left: auto; width: 190px; padding: 7px 14px; border-radius: 999px; background: rgba(255, 255, 255, .12); color: #b9cbbd; font-size: 13px; }
  .cart { font-size: 14px; }
  main { max-width: 944px; margin: 0 auto; padding: 22px 40px 60px; }
  .crumbs { font-size: 13px; color: #6c7a70; margin-bottom: 4px; }
  h1 { font-size: 26px; margin: 0 0 16px; letter-spacing: -.01em; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .card { background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 1px 2px rgba(31, 61, 43, .08), 0 8px 22px -14px rgba(31, 61, 43, .35); }
  .art { height: 150px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; }
  .body { padding: 12px 16px 14px; }
  .name { display: block; font-weight: 600; font-size: 16px; color: inherit; text-decoration: none; }
  .meta { font-size: 13px; color: #6c7a70; margin: 1px 0 10px; }
  .row { display: flex; align-items: center; justify-content: space-between; }
  .price { font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
  .add { padding: 5px 13px; border-radius: 999px; border: 1px solid #1f3d2b; color: #1f3d2b; font-size: 13px; font-weight: 600; }
</style>
</head>
<body>
  <header>
    <span class="logo">Mountain <span>Leaf</span> Tea</span>
    <nav><span>Green</span><b>Oolong</b><span>Pu-erh</span><span>Red</span><span>Teaware</span></nav>
    <span class="search">Search teas</span><span class="cart">Cart (2)</span>
  </header>
  <main>
    <div class="crumbs">Shop / Oolong and pu-erh</div>
    <h1>Oolong and pu-erh</h1>
    <div class="grid" id="grid"></div>
  </main>
  <script>
    // slug, name, details, price, tin colour, lid colour, two label lines
    const teas = [
      ['da-hong-pao', 'Da Hong Pao', 'Rock oolong · 50 g', '€14.50', '#8a4b2d', '#5a2c18', 'DA HONG', 'PAO'],
      ['tie-guan-yin', 'Tie Guan Yin', 'Light oolong · 50 g', '€11.90', '#7fa35a', '#4d6e33', 'TIE GUAN', 'YIN'],
      ['menghai-shu-2018', 'Menghai Shu Pu-erh 2018', 'Ripe pu-erh · 357 g cake', '€32.00', '#4a372e', '#2a1d17', 'MENGHAI', 'SHU 2018'],
      ['rou-gui', 'Rou Gui', 'Rock oolong · 30 g', '€10.90', '#b5763f', '#7b4a22', 'ROU', 'GUI'],
      ['dian-hong', 'Dian Hong', 'Red tea · 50 g', '€8.40', '#c2552d', '#86351a', 'DIAN', 'HONG'],
      ['gaba-alishan', 'GABA Alishan', 'High mountain oolong · 50 g', '€15.80', '#5f7f6e', '#3a5346', 'GABA', 'ALISHAN'],
    ];
    const tin = (body, lid, line1, line2) => `
      <svg viewBox="0 0 120 150" width="108" height="135" aria-hidden="true">
        <ellipse cx="60" cy="141" rx="46" ry="6" fill="rgba(0,0,0,.13)"/>
        <rect x="18" y="26" width="84" height="113" rx="10" fill="${body}"/>
        <rect x="18" y="26" width="24" height="113" rx="10" fill="rgba(255,255,255,.16)"/>
        <rect x="86" y="26" width="16" height="113" rx="8" fill="rgba(0,0,0,.12)"/>
        <rect x="13" y="14" width="94" height="23" rx="8" fill="${lid}"/>
        <rect x="13" y="14" width="94" height="8" rx="4" fill="rgba(255,255,255,.14)"/>
        <rect x="27" y="60" width="66" height="50" rx="6" fill="#fbf7ec"/>
        <rect x="33" y="66" width="54" height="2" fill="${lid}" opacity=".5"/>
        <text x="60" y="85" text-anchor="middle" font-family="Helvetica Neue, sans-serif" font-size="10.5" font-weight="700" letter-spacing=".6" fill="${lid}">${line1}</text>
        <text x="60" y="99" text-anchor="middle" font-family="Helvetica Neue, sans-serif" font-size="10.5" font-weight="700" letter-spacing=".6" fill="${lid}">${line2}</text>
      </svg>`;
    for (const [slug, name, meta, price, body, lid, line1, line2] of teas) {
      document.getElementById('grid').insertAdjacentHTML('beforeend',
        `<div class="card"><div class="art" style="background: linear-gradient(180deg, ${body}1f, ${body}38)">${tin(body, lid, line1, line2)}</div>
         <div class="body"><a class="name" href="/tea/${slug}">${name}</a><div class="meta">${meta}</div>
         <div class="row"><span class="price">${price}</span><span class="add">Add to cart</span></div></div></div>`);
    }
  </script>
</body>
</html>

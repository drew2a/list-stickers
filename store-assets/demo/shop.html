<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mountain Leaf Tea: oolong and pu-erh</title>
<style>
  /* A made-up tea shop, used only to take the store screenshots: no real
     shop's name or design appears in them. */
  body { margin: 0; font: 16px/1.45 "Helvetica Neue", system-ui, sans-serif; color: #26221c; background: #f6f5f1; }
  header { display: flex; align-items: center; gap: 28px; padding: 16px 48px; background: #fff; border-bottom: 1px solid #e4e1d8; }
  .logo { font-weight: 700; font-size: 20px; letter-spacing: .02em; color: #2f5d3a; }
  nav { display: flex; gap: 22px; font-size: 15px; color: #6c665b; }
  nav b { color: #26221c; }
  main { max-width: 1120px; margin: 0 auto; padding: 26px 48px 60px; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  .sub { color: #6c665b; margin: 0 0 22px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
  .card { background: #fff; border: 1px solid #e4e1d8; border-radius: 10px; overflow: hidden; }
  .photo { height: 150px; display: flex; align-items: center; justify-content: center; }
  .cake { width: 92px; height: 92px; border-radius: 50%; box-shadow: inset 0 0 0 10px rgba(255, 255, 255, .16), 0 6px 14px rgba(0, 0, 0, .25); }
  .body { padding: 12px 14px 14px; }
  .name { display: block; font-weight: 600; color: inherit; text-decoration: none; }
  .meta { font-size: 13px; color: #6c665b; margin: 2px 0 8px; }
  .price { font-weight: 600; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <header><span class="logo">Mountain Leaf Tea</span><nav><span>Green</span><b>Oolong</b><span>Pu-erh</span><span>Red</span><span>Teaware</span></nav></header>
  <main>
    <h1>Oolong and pu-erh</h1>
    <p class="sub">8 teas</p>
    <div class="grid" id="grid"></div>
  </main>
  <script>
    const teas = [
      ['da-hong-pao', 'Da Hong Pao', 'rock oolong · 50 g', '€14.50', '#6a3f27', '#3f2416'],
      ['tie-guan-yin', 'Tie Guan Yin', 'light oolong · 50 g', '€11.90', '#a8c27c', '#5f7f3f'],
      ['menghai-shu-2018', 'Menghai Shu Pu-erh 2018', 'cake · 357 g', '€32.00', '#5a4034', '#261a14'],
      ['rou-gui', 'Rou Gui', 'rock oolong · 30 g', '€10.90', '#b07a4a', '#6d4226'],
      ['dian-hong', 'Dian Hong', 'red tea · 50 g', '€8.40', '#c98342', '#7d3f17'],
      ['gaba-alishan', 'GABA Alishan', 'oolong · 50 g', '€15.80', '#8d9a5c', '#4a5531'],
      ['bai-mu-dan', 'Bai Mu Dan', 'white tea · 50 g', '€9.60', '#d9d2b8', '#9a916f'],
      ['sheng-2021', 'Yiwu Sheng Pu-erh 2021', 'cake · 200 g', '€41.00', '#7c8a52', '#3e4a28'],
    ];
    for (const [slug, name, meta, price, light, dark] of teas) {
      document.getElementById('grid').insertAdjacentHTML('beforeend',
        `<div class="card"><div class="photo" style="background:${light}33"><div class="cake" style="background:radial-gradient(circle at 35% 30%, ${light}, ${dark})"></div></div>
         <div class="body"><a class="name" href="/tea/${slug}">${name}</a><div class="meta">${meta}</div><div class="price">${price}</div></div></div>`);
    }
  </script>
</body>
</html>
